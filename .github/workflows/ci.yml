name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run. macOS runners are
# capped at 5 concurrent jobs per account, so stale runs would block real ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # `macos-26` is required, not a preference: Package.swift pins
    # `.macOS(.v26)` and the UI calls `glassEffect` with no availability
    # branching, so the build needs the macOS 26 SDK.
    # Standard macOS runners are free and unlimited on public repositories.
    runs-on: macos-26

    steps:
      # v6.0.2 — pin the immutable commit, not the movable v6 tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This read-only CI job never pushes, so do not leave GITHUB_TOKEN
          # credentials available to later build or test commands.
          persist-credentials: false

      # Runner images are refreshed weekly and the default Xcode moves with
      # them. Pick the newest Xcode 26.x explicitly so a toolchain bump shows up
      # in the log instead of as a mysterious build failure. Any 26.x ships the
      # macOS 26 SDK, so "newest 26" is enough — no need to pin a patch version.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Formatting is checked first, then compiler warnings are promoted to
      # errors so diagnostics appear with the usual file/line/code frame.
      - name: Lint
        run: ./scripts/lint.sh

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # XcodeGen turns xcode/project.yml into the project that builds the .app.
      # The project file is not committed, so it is generated here too.
      # Through mise so that CI and a developer's machine run the same pinned
      # version. The project file is generated rather than committed, so the
      # generator's version is what decides what gets built.
      - name: Install XcodeGen
        run: |
          brew install mise
          mise install

      # The shipped bundle is built by Xcode rather than SwiftPM, and the
      # difference is not cosmetic: a SwiftPM-built .app cannot find its package
      # resources on any machine but the one that compiled it. Building it here
      # keeps that path from rotting between releases.
      - name: Build the app bundle
        run: ./scripts/build_app.sh release

      # Checks that the resources actually resolve out of Contents/Resources.
      # This is what would have caught the v0.1.0 release, which crashed on
      # launch for everyone except the machine that built it.
      - name: Verify the app bundle
        run: ./scripts/verify_app_bundle.sh
