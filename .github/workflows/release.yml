name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    environment:
      name: release

    steps:
      # v6.0.2 — pin the immutable commit, not the movable v6 tag.
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Release must run from a tag" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3" >&2
            exit 1
          fi

          git rev-parse --verify origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          artifact="AgentNotch-${GITHUB_REF_NAME}-macos-arm64.zip"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "RELEASE_ARTIFACT=$artifact" >>"$GITHUB_ENV"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/lint.sh
          swift build --build-tests
          swift test --skip-build

      # The signing key lives in a throwaway keychain for the length of the job,
      # not in the login keychain, and the decoded .p12 is removed as soon as it
      # has been imported. The "Discard signing material" step below tears the
      # keychain down even when a later step fails.
      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode >"$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt for keychain access
          # that no one can answer on a runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          echo "RELEASE_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Write App Store Connect key
        shell: bash
        env:
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_PRIVATE_KEY" | base64 --decode >"$key"
          chmod 600 "$key"
          echo "NOTARY_KEY=$key" >>"$GITHUB_ENV"

      # build_release.sh signs, submits to Apple, staples the ticket, and only
      # then assembles the ZIP and the Cask. It fails the job if notarization
      # comes back as anything other than Accepted.
      - name: Build release assets
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./scripts/build_release.sh \
            --build-version "$RELEASE_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"

      # Immutable Releases lock assets at publication time. Build the complete
      # draft first, then publish only after every validation has succeeded.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Agent Notch $GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/$RELEASE_ARTIFACT" \
            dist/checksums.txt \
            dist/agent-notch.rb
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      # This runs after the release is public, never before: the Cask points at
      # the release asset, so a tap updated first would serve a 404 to anyone
      # who installed in between.
      #
      # GITHUB_TOKEN is scoped to this repository alone, so pushing to the tap
      # needs a token that carries contents:write on tosaka07/homebrew-tap.
      - name: Update the Homebrew tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap cannot be updated" >&2
            exit 1
          fi

          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/tosaka07/homebrew-tap.git" \
            "$tap"
          cp dist/agent-notch.rb "$tap/Casks/agent-notch.rb"

          if git -C "$tap" diff --quiet -- Casks/agent-notch.rb; then
            echo "The tap already carries this Cask"
            exit 0
          fi
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Casks/agent-notch.rb
          git -C "$tap" commit -m "agent-notch $RELEASE_VERSION"
          git -C "$tap" push

      - name: Discard signing material
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # The tap clone keeps its push token in .git/config.
          rm -rf "$RUNNER_TEMP/homebrew-tap"
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security list-keychain -d user -s login.keychain-db
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
